name: Reusable Static Site Deploy (S3 + CloudFront)

on:
  workflow_call:
    inputs:
      bucket-name:
        description: 'S3 bucket that hosts the static site'
        required: true
        type: string
      distribution-id:
        description: >-
          CloudFront distribution ID for cache invalidation. Omit for
          Cloudflare-Worker-fronted buckets — CloudFront invalidation is
          skipped when empty.
        required: false
        type: string
        default: ''
      tags:
        description: >-
          Cost-allocation tags as space-separated Key=Value pairs. Project and
          Environment are REQUIRED (deploy fails without them); Repository is
          auto-added from github.repository. e.g. "Project=homepage
          Environment=prod".
        required: false
        type: string
        default: ''
      aws-region:
        description: 'AWS region for the S3 bucket'
        required: false
        type: string
        default: 'us-east-1'
      node-version:
        description: 'Node.js version'
        required: false
        type: string
        default: '24'
      package-manager:
        description: 'Package manager (npm or pnpm)'
        required: false
        type: string
        default: 'npm'
      build-command:
        description: 'Command that produces the static output'
        required: false
        type: string
        default: 'npm run build'
      build-output-dir:
        description: 'Directory of build output to upload (relative to repo root)'
        required: false
        type: string
        default: 'out'
      working-directory:
        description: 'Directory to run the build from'
        required: false
        type: string
        default: '.'
      invalidation-paths:
        description: 'Newline- or space-separated CloudFront paths to invalidate'
        required: false
        type: string
        default: '/*'
      sync-delete:
        description: 'Pass --delete to s3 sync to remove orphaned objects'
        required: false
        type: boolean
        default: true
      sync-exclude:
        description: >-
          Glob excluded from the sync in both directions. Defaults to
          'previews/*' — the prefix reserved by preview-s3-deploy.yml — so
          production deploys never delete live PR previews. Set to '' if your
          site legitimately ships a previews/ path (which also means you
          can't host PR previews on this bucket).
        required: false
        type: string
        default: 'previews/*'
      cache-control-immutable:
        description: 'Glob (relative to build-output-dir) whose objects get long-cache headers. Empty disables.'
        required: false
        type: string
        default: '_next/static/*'
      build-args:
        description: 'Environment variables to set for the build step (KEY=VALUE per line)'
        required: false
        type: string
        default: ''
      checkout-ref:
        description: 'Git ref to checkout (defaults to triggering ref)'
        required: false
        type: string
        default: ''
      whats-new-path:
        description: >-
          Bake the latest release's whats-new.json into the build at this path
          (relative to working-directory, e.g. public/whats-new.json).
          Empty disables. See the What's-New section of the README.
        required: false
        type: string
        default: ''
      environment:
        description: >-
          GitHub environment name (in the calling repo) to apply to the deploy
          job. Enables environment protection rules (approvals, wait timers) and
          environment-scoped secrets. Requires the caller to pass
          `secrets: inherit`. Empty = no environment.
        required: false
        type: string
        default: ''
      track-deployment:
        description: >-
          Create a GitHub Deployment record (DORA raw data). When true, a
          Deployment is opened before the deploy and a deployment_status of
          success/failure is posted after. Both steps are best-effort
          (continue-on-error: true) so tracking never breaks a deploy.
          Requires the caller's job to have `deployments: write` permission —
          add it to the calling workflow's job permissions block.
        required: false
        type: boolean
        default: false
      npm-scope:
        description: >-
          npm scope for a private registry (e.g. @kotahusky). Enables
          scoped-registry auth when set.
        required: false
        type: string
        default: ''
      registry-url:
        description: 'Registry URL for the scope (e.g. https://npm.pkg.github.com).'
        required: false
        type: string
        default: ''
    secrets:
      role-arn:
        description: 'IAM role ARN for AWS authentication via OIDC'
        required: true
      packages-read-token:
        description: >-
          Token with read:packages for the private scope; used as
          NODE_AUTH_TOKEN during install.
        required: false
    outputs:
      invalidation-id:
        description: 'CloudFront invalidation ID'
        value: ${{ jobs.deploy.outputs.invalidation-id }}
      objects-uploaded:
        description: 'Number of objects synced to S3 (parsed from aws cli output)'
        value: ${{ jobs.deploy.outputs.objects-uploaded }}

concurrency:
  group: static-s3-${{ inputs.bucket-name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    outputs:
      invalidation-id: ${{ steps.invalidate.outputs.invalidation-id }}
      objects-uploaded: ${{ steps.sync.outputs.objects-uploaded }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}

      # corepack must run before setup-node: its pnpm cache resolution
      # shells out to `pnpm store path`, which needs the corepack shim.
      - name: Enable corepack (pnpm)
        if: inputs.package-manager == 'pnpm'
        shell: bash
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}
          # When registry-url is set, setup-node writes an .npmrc wiring the
          # scope to the private registry with NODE_AUTH_TOKEN. Empty values are
          # a no-op, so public-package builds are unaffected.
          registry-url: ${{ inputs.registry-url }}
          scope: ${{ inputs.npm-scope }}

      - name: Install dependencies
        shell: bash
        env:
          # Consumed by the .npmrc setup-node writes when registry-url is set.
          # Harmless when empty (public-package builds).
          NODE_AUTH_TOKEN: ${{ secrets.packages-read-token }}
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            corepack enable
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Export build environment variables
        if: inputs.build-args != ''
        shell: bash
        run: |
          while IFS= read -r LINE; do
            [ -z "$LINE" ] && continue
            echo "$LINE" >> "$GITHUB_ENV"
          done <<< "${{ inputs.build-args }}"

      - name: Inject what's-new summary
        if: inputs.whats-new-path != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.whats-new-path }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${TARGET}")"
          if gh release download --repo "${{ github.repository }}" --pattern 'whats-new.json' --output "${TARGET}" --clobber 2>/dev/null; then
            echo "Injected what's-new summary at ${TARGET}"
          else
            echo "::notice title=whats-new::No whats-new.json asset found (note: drafts/prereleases are not considered; this step always bakes the latest release's summary) — skipping injection. The app should handle the file being absent."
          fi

      - name: Build
        shell: bash
        run: ${{ inputs.build-command }}

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Resolve deploy tags
        id: tags
        shell: bash
        env:
          REPO: ${{ github.repository }}
          TAGS_IN: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          ENTRIES=""
          HAS_PROJECT=0
          HAS_ENV=0
          HAS_REPO=0
          # tags is a space-separated list of Key=Value pairs; word-splitting is
          # intentional so each pair becomes its own TagSet entry.
          # shellcheck disable=SC2086
          for PAIR in ${TAGS_IN}; do
            KEY="${PAIR%%=*}"
            VAL="${PAIR#*=}"
            ENTRIES="${ENTRIES}${ENTRIES:+,}{Key=${KEY},Value=${VAL}}"
            case "${KEY}" in
              Project)     [ -n "${VAL}" ] && HAS_PROJECT=1 ;;
              Environment) [ -n "${VAL}" ] && HAS_ENV=1 ;;
              Repository)  HAS_REPO=1 ;;
            esac
          done
          # Auto-add Repository from the calling repo unless the caller set it.
          if [ "${HAS_REPO}" = "0" ]; then
            ENTRIES="${ENTRIES}${ENTRIES:+,}{Key=Repository,Value=${REPO}}"
          fi
          # Enforce the required cost-allocation tags (fail fast before sync).
          MISSING=""
          [ "${HAS_PROJECT}" = "0" ] && MISSING="${MISSING} Project"
          [ "${HAS_ENV}" = "0" ] && MISSING="${MISSING} Environment"
          if [ -n "${MISSING}" ]; then
            echo "::error title=Missing required tags::static-s3-deploy requires these tag(s) via the 'tags' input:${MISSING}. Example: tags: \"Project=homepage Environment=prod\" (Repository is added automatically)."
            exit 1
          fi
          echo "tagset=TagSet=[${ENTRIES}]" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Deployment (DORA tracking)
        id: gh-deploy
        if: inputs.track-deployment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ENV: ${{ inputs.environment || 'production' }}
          DEPLOY_REF: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Callers must grant `deployments: write` on their job; without it
          # this step is skipped gracefully via continue-on-error.
          DEPLOY_ID=$(gh api "repos/${REPO}/deployments" \
            -f ref="${DEPLOY_REF}" \
            -f environment="${DEPLOY_ENV}" \
            -F auto_merge=false \
            -f required_contexts='[]' \
            -f description='Static site deploy started' \
            --jq '.id')
          echo "deployment-id=${DEPLOY_ID}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Deployment tracking::Created GitHub Deployment ${DEPLOY_ID} for ${DEPLOY_ENV}. Requires deployments: write on the calling job."

      - name: Sync build output to S3
        id: sync
        shell: bash
        env:
          SYNC_EXCLUDE: ${{ inputs.sync-exclude }}
        run: |
          DELETE_FLAG=""
          if [ "${{ inputs.sync-delete }}" = "true" ]; then
            DELETE_FLAG="--delete"
          fi

          # Default short cache for everything (HTML, etc.)
          # sync-exclude (default previews/*) keeps production deploys from
          # deleting live PR previews; the exclusion filters BOTH directions,
          # so warn loudly if the build output itself contains the prefix.
          EXCLUDE_ARGS=()
          if [ -n "${SYNC_EXCLUDE}" ]; then
            EXCLUDE_ARGS=(--exclude "${SYNC_EXCLUDE}")
            LOCAL_DIR="${SYNC_EXCLUDE%%/*}"
            if [ -e "${{ inputs.build-output-dir }}/${LOCAL_DIR}" ]; then
              echo "::warning title=sync-exclude::Build output contains '${LOCAL_DIR}/', which matches sync-exclude ('${SYNC_EXCLUDE}') and will NOT be uploaded. Set sync-exclude: '' if this path is part of your site (that bucket then can't host PR previews)."
            fi
          fi
          aws s3 sync "${{ inputs.build-output-dir }}/" "s3://${{ inputs.bucket-name }}/" \
            $DELETE_FLAG \
            "${EXCLUDE_ARGS[@]}" \
            --cache-control "public, max-age=60, must-revalidate" \
            | tee /tmp/sync.log

          # Long-cache pass for fingerprinted/immutable assets (Next's _next/static, etc.)
          if [ -n "${{ inputs.cache-control-immutable }}" ] \
             && [ -d "${{ inputs.build-output-dir }}/$(dirname "${{ inputs.cache-control-immutable }}")" ]; then
            aws s3 cp "${{ inputs.build-output-dir }}/$(dirname "${{ inputs.cache-control-immutable }}")" \
              "s3://${{ inputs.bucket-name }}/$(dirname "${{ inputs.cache-control-immutable }}")" \
              --recursive \
              --cache-control "public, max-age=31536000, immutable"
          fi

          # grep exits 1 on no-match; with pipefail+bash5 that propagates through $().
          # Wrap in a group command with `|| true` so the pipeline always exits 0
          # while still counting zero when there are no upload/copy lines.
          COUNT=$({ grep -E '^(upload|copy):' /tmp/sync.log || true; } | wc -l | tr -d ' ')
          echo "objects-uploaded=${COUNT}" >> "$GITHUB_OUTPUT"

      - name: Tag S3 bucket
        shell: bash
        run: |
          aws s3api put-bucket-tagging \
            --bucket "${{ inputs.bucket-name }}" \
            --tagging "${{ steps.tags.outputs.tagset }}"

      - name: Invalidate CloudFront cache
        id: invalidate
        if: inputs.distribution-id != ''
        shell: bash
        run: |
          # Convert newline- or space-separated input to a space-joined list.
          # $PATHS is intentionally unquoted so the AWS CLI receives each path
          # as a separate argument (--paths requires multiple positional args).
          # shellcheck disable=SC2086
          PATHS=$(echo "${{ inputs.invalidation-paths }}" | tr '\n' ' ')
          INV_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ inputs.distribution-id }}" \
            --paths $PATHS \
            --query 'Invalidation.Id' \
            --output text)
          echo "invalidation-id=${INV_ID}" >> "$GITHUB_OUTPUT"

      - name: Post GitHub Deployment status (DORA tracking)
        if: always() && inputs.track-deployment && steps.gh-deploy.outputs.deployment-id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOY_ID: ${{ steps.gh-deploy.outputs.deployment-id }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          INVALIDATE_OUTCOME: ${{ steps.invalidate.outcome }}
        run: |
          set -euo pipefail
          STATE="failure"
          # Invalidation is skipped for Cloudflare-Worker-fronted buckets
          # (empty distribution-id); treat "skipped" as non-blocking.
          if [ "${SYNC_OUTCOME}" = "success" ] \
             && { [ "${INVALIDATE_OUTCOME}" = "success" ] || [ "${INVALIDATE_OUTCOME}" = "skipped" ]; }; then
            STATE="success"
          fi
          gh api "repos/${REPO}/deployments/${DEPLOY_ID}/statuses" \
            -f state="${STATE}" \
            -f description="Static site deploy ${STATE}"
          echo "::notice title=Deployment tracking::Posted deployment_status=${STATE} for deployment ${DEPLOY_ID}."

      - name: Summarize deployment
        shell: bash
        run: |
          echo "### Static site deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Bucket:** \`s3://${{ inputs.bucket-name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Objects synced:** ${{ steps.sync.outputs.objects-uploaded }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ inputs.distribution-id }}" ]; then
            echo "- **Distribution:** \`${{ inputs.distribution-id }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Invalidation:** \`${{ steps.invalidate.outputs.invalidation-id }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **CloudFront:** skipped (Cloudflare-Worker-fronted bucket)" >> "$GITHUB_STEP_SUMMARY"
          fi
